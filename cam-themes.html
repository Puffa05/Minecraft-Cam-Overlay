<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===================== Einstellungen =====================
const STATE_URL = 'http://127.0.0.1:7475/state'; // Zustands-Server im Mod
const POLL_MS   = 100;   // wie oft der Zustand abgefragt wird
const FADE_S    = 1.5;   // Dauer der Überblendung in Sekunden
const STRENGTH  = 1.0;   // Gesamtstärke aller Themes (0 bis 1)
const PORTAL_RAMP_MS = 4000; // Portal schwillt so lange an (Vanilla-Survival: 4 s)
const HIT_MS    = 450;   // Dauer des roten Aufleuchtens bei Schaden
const HIT_ALPHA = 0.7;   // Stärke des roten Rahmens
// Wie lange ein Zustand stabil sein muss, bevor er zählt (gegen Flackern)
const DEBOUNCE_MS = { inPortal: 100, underwater: 250, cherry: 1000 };
// Testen ohne Minecraft (an die Datei-URL anhängen):
//   ?demo   ?theme=portal   ?theme=underwater   ?theme=freeze   ?theme=cherry
//   Im Demo-Modus gibt es alle 2 Sekunden einen Test-Treffer.
// =========================================================

const params = new URLSearchParams(location.search);
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0, D = 0, M = 0;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------------- Zustand vom Mod ----------------
let state = null;
let inFlight = false;

async function poll() {
  if (inFlight) return;
  inFlight = true;
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 500);
    const res = await fetch(STATE_URL, { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(to);
    state = await res.json();
  } catch (e) {
    state = null; // Minecraft/Mod läuft nicht -> alles ausblenden
  } finally {
    inFlight = false;
  }
}

// Testmodus
const testTheme = params.get('theme');
const demo = params.has('demo');
function testState(ms) {
  const s = { inWorld: true, inPortal: false, underwater: false, inLava: false,
              freeze: 0, biome: 'minecraft:plains', hits: demo ? Math.floor(ms / 2000) : 0 };
  let theme = testTheme, phase = 0;
  if (demo) {
    const list = ['portal', 'underwater', 'freeze', 'cherry', 'none'];
    theme = list[Math.floor(ms / 6000) % list.length];
    phase = (ms % 6000) / 6000;
  }
  if (theme === 'portal') s.inPortal = phase < 0.85 || !demo;
  if (theme === 'underwater') s.underwater = true;
  if (theme === 'freeze') s.freeze = demo ? Math.min(phase * 1.6, 1) : 1;
  if (theme === 'cherry') s.biome = 'minecraft:cherry_grove';
  return s;
}

if (!testTheme && !demo) { poll(); setInterval(poll, POLL_MS); }

// ---------------- Entprellen ----------------
const stable = {}, pending = {};
function debounce(key, value, now) {
  const delay = DEBOUNCE_MS[key] ?? 0;
  if (!(key in stable)) { stable[key] = value; return value; }
  if (value === stable[key]) { delete pending[key]; return value; }
  if (!pending[key] || pending[key].v !== value) pending[key] = { v: value, t: now };
  if (now - pending[key].t >= delay) { stable[key] = value; delete pending[key]; }
  return stable[key];
}

// ---------------- Theme-Auswahl nach Priorität ----------------
// Neue Themes hier einhängen, z. B. ganz oben:  if (s.inLava) return 'lava';
let freezeLevel = 0;
let portalSince = null;
function pickTheme(s, now) {
  const portal = debounce('inPortal', !!(s && s.inPortal), now);
  const uw = debounce('underwater', !!(s && s.underwater), now);
  const cherry = debounce('cherry', !!(s && s.biome === 'minecraft:cherry_grove'), now);

  if (portal && portalSince === null) portalSince = now;
  if (!portal) portalSince = null;

  if (portal) return 'portal';              // 1. Portal
  if (freezeLevel > 0.03) return 'freeze';  // 2. Frieren
  if (uw) return 'underwater';              // 3. Unterwasser
  if (cherry) return 'cherry';              // 4. Kirschblüten
  return 'none';
}

const alpha = { portal: 0, underwater: 0, freeze: 0, cherry: 0 };

// ---------------- Theme: Portal ----------------
const portalSwirls = Array.from({ length: 120 }, () => ({
  a: rnd(0, Math.PI * 2), r: rnd(0.05, 0.75), speed: rnd(0.15, 0.6) * (Math.random() < 0.5 ? -1 : 1),
  size: rnd(0.06, 0.18), hue: rnd(262, 292), phase: rnd(0, 10)
}));
const portalSparks = Array.from({ length: 60 }, () => ({
  x: Math.random(), y: Math.random(), vy: rnd(-0.08, -0.02), vx: rnd(-0.02, 0.02), size: rnd(1.5, 4)
}));
let portalK = 0; // zuletzt gezeichnete Stärke, damit das Ausblenden nicht springt
function drawPortal(a, t, dt, now) {
  if (portalSince !== null) {
    const p = Math.min((now - portalSince) / PORTAL_RAMP_MS, 1);
    portalK = p * p * 0.8;
  }
  const k = portalK * a;
  if (k <= 0.001) return;
  const spin = 1 + (portalK / 0.8) * 2.5;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(70, 0, 130, ${0.45 * k})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (const s of portalSwirls) {
    const ang = s.a + t * s.speed * spin;
    const rad = s.r * D * (0.55 + 0.08 * Math.sin(t * 1.7 + s.phase));
    const x = W / 2 + Math.cos(ang) * rad;
    const y = H / 2 + Math.sin(ang) * rad * 0.7;
    const size = s.size * D;
    const g = ctx.createRadialGradient(x, y, 0, x, y, size);
    g.addColorStop(0, `hsla(${s.hue}, 95%, 60%, ${0.22 * k})`);
    g.addColorStop(1, `hsla(${s.hue}, 95%, 40%, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - size, y - size, size * 2, size * 2);
  }
  for (const sp of portalSparks) {
    sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    if (sp.y < -0.05) { sp.y = 1.05; sp.x = Math.random(); }
    ctx.fillStyle = `rgba(220, 160, 255, ${0.9 * k})`;
    ctx.fillRect(sp.x * W, sp.y * H, sp.size, sp.size);
  }

  ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(W / 2, H / 2, D * 0.2, W / 2, H / 2, D * 0.75);
  v.addColorStop(0, 'rgba(30, 0, 60, 0)');
  v.addColorStop(1, `rgba(30, 0, 60, ${0.8 * k})`);
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ---------------- Theme: Unterwasser ----------------
const bubbles = Array.from({ length: 28 }, () => newBubble(true));
function newBubble(anywhere) {
  const left = Math.random() < 0.5; // nur an den Rändern, nicht übers Gesicht
  return {
    x: left ? rnd(0.02, 0.2) : rnd(0.8, 0.98),
    y: anywhere ? Math.random() : rnd(1.02, 1.2),
    r: rnd(2, 7), vy: rnd(0.06, 0.16), phase: rnd(0, 10)
  };
}
function drawUnderwater(a, t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(20, 75, 150, ${0.26 * a})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = ((t * 0.04 + i * 0.23) % 1.4 - 0.2) * W + Math.sin(t * 0.7 + i) * 30;
    const g = ctx.createLinearGradient(x - 60, 0, x + 60, 0);
    g.addColorStop(0, 'rgba(140, 210, 255, 0)');
    g.addColorStop(0.5, `rgba(140, 210, 255, ${0.07 * a})`);
    g.addColorStop(1, 'rgba(140, 210, 255, 0)');
    ctx.save();
    ctx.translate(x, 0); ctx.transform(1, 0, 0.35, 1, 0, 0); ctx.translate(-x, 0);
    ctx.fillStyle = g;
    ctx.fillRect(x - 60, 0, 120, H);
    ctx.restore();
  }

  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    if (b.y < -0.05) bubbles[i] = newBubble(false);
    const x = b.x * W + Math.sin(t * 2 + b.phase) * 6;
    const y = b.y * H;
    ctx.strokeStyle = `rgba(210, 235, 255, ${0.55 * a})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 * a})`;
    ctx.beginPath(); ctx.arc(x - b.r * 0.35, y - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2); ctx.fill();
  }

  const v = ctx.createRadialGradient(W / 2, H / 2, D * 0.25, W / 2, H / 2, D * 0.75);
  v.addColorStop(0, 'rgba(0, 25, 70, 0)');
  v.addColorStop(1, `rgba(0, 25, 70, ${0.6 * a})`);
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  // Fische und Kugelfisch (nach der Vignette, damit sie gut sichtbar bleiben)
  for (let i = 0; i < fishes.length; i++) {
    const f = fishes[i];
    f.x += f.dir * f.speed * dt;
    if (f.x < -0.15 || f.x > 1.15) fishes[i] = newFish(false);
    drawFish(fishes[i], a, t);
  }
  updatePuffer(dt);
  drawPuffer(a, t);
}

// ---------------- Fische ----------------
const FISH_COUNT = 6;
// Farben als [Farbton, Sättigung, Helligkeit]
const FISH_COLORS = [[24, 90, 58], [200, 70, 55], [12, 85, 56], [190, 60, 45], [330, 60, 65], [160, 55, 48]];
const fishes = Array.from({ length: FISH_COUNT }, () => newFish(true));

// Fische schwimmen unten oder oben am Rand, nicht übers Gesicht
function swimBand() { return Math.random() < 0.65 ? rnd(0.72, 0.9) : rnd(0.07, 0.2); }
function newFish(anywhere) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  return {
    dir, x: anywhere ? Math.random() : (dir > 0 ? -0.12 : 1.12), y: swimBand(),
    len: rnd(0.08, 0.12), speed: rnd(0.03, 0.07), phase: rnd(0, 10), bob: rnd(0.004, 0.012),
    col: FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)]
  };
}
function drawFish(f, a, t) {
  const L = f.len * M;
  const x = f.x * W, y = f.y * H + Math.sin(t * 1.3 + f.phase) * f.bob * H;
  const [h, s, l] = f.col;
  const tail = Math.sin(t * 8 + f.phase) * 0.25;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(f.dir, 1);
  // Schwanz
  ctx.fillStyle = `hsla(${h}, ${s}%, ${l - 10}%, ${a})`;
  ctx.beginPath();
  ctx.moveTo(-L * 0.35, 0);
  ctx.lineTo(-L * 0.62, -L * 0.22 + tail * L * 0.2);
  ctx.lineTo(-L * 0.62, L * 0.22 + tail * L * 0.2);
  ctx.closePath(); ctx.fill();
  // Körper
  ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${a})`;
  ctx.beginPath(); ctx.ellipse(0, 0, L * 0.42, L * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  // heller Bauch
  ctx.fillStyle = `hsla(${h}, ${s}%, ${Math.min(l + 22, 92)}%, ${0.6 * a})`;
  ctx.beginPath(); ctx.ellipse(L * 0.03, L * 0.08, L * 0.28, L * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  // Rückenflosse
  ctx.fillStyle = `hsla(${h}, ${s}%, ${l - 10}%, ${a})`;
  ctx.beginPath();
  ctx.moveTo(-L * 0.12, -L * 0.17);
  ctx.quadraticCurveTo(L * 0.02, -L * 0.36, L * 0.14, -L * 0.17);
  ctx.closePath(); ctx.fill();
  // Auge
  ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
  ctx.beginPath(); ctx.arc(L * 0.26, -L * 0.04, L * 0.055, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(10, 20, 30, ${a})`;
  ctx.beginPath(); ctx.arc(L * 0.275, -L * 0.04, L * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------- Kugelfisch ----------------
const PUFF_MIN_S = 6, PUFF_MAX_S = 14; // Abstand zwischen zwei Aufblas-Momenten
const PUFF_HOLD_S = 2.2;               // so lange bleibt er aufgeblasen
const puffer = { x: 0.15, y: 0.82, dir: 1, speed: 0.025, inflate: 0, mode: 'idle', modeT: 0, nextPuff: rnd(3, 6) };
// leichtes Überschwingen beim Aufblasen ("Plopp")
const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

function updatePuffer(dt) {
  const p = puffer;
  p.modeT += dt;
  if (p.mode === 'idle') {
    p.nextPuff -= dt;
    if (p.nextPuff <= 0) { p.mode = 'puff'; p.modeT = 0; }
  } else if (p.mode === 'puff') {
    p.inflate = easeOutBack(Math.min(1, p.modeT / 0.3));
    if (p.modeT > 0.3 + PUFF_HOLD_S) { p.mode = 'deflate'; p.modeT = 0; }
  } else if (p.mode === 'deflate') {
    p.inflate = Math.max(0, 1 - p.modeT / 0.8);
    if (p.inflate <= 0) { p.mode = 'idle'; p.nextPuff = rnd(PUFF_MIN_S, PUFF_MAX_S); }
  }
  // Aufgeblasen kommt er kaum voran. Am Rand dreht er um und bleibt so im Bild.
  p.x += p.dir * p.speed * (1 - 0.85 * Math.min(p.inflate, 1)) * dt;
  if (p.x > 0.9) p.dir = -1;
  if (p.x < 0.1) p.dir = 1;
}

const PUFF_SPOTS = [[-0.35, -0.35], [0.05, -0.5], [-0.6, -0.05], [0.25, -0.25], [-0.15, -0.15], [-0.4, 0.2]];
function drawPuffer(a, t) {
  const p = puffer;
  const e = Math.max(0, p.inflate);
  const base = 0.05 * M;
  const r = base * (1 + 0.75 * e);
  const x = p.x * W, y = p.y * H + Math.sin(t * 1.1) * 0.01 * H;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(p.dir, 1);

  // Stacheln (nur aufgeblasen)
  if (e > 0.02) {
    ctx.strokeStyle = `hsla(38, 55%, 35%, ${a * Math.min(e, 1)})`;
    ctx.lineWidth = Math.max(1.2, base * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    const n = 18;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + 0.1;
      ctx.moveTo(Math.cos(ang) * r * 0.9, Math.sin(ang) * r * 0.9);
      ctx.lineTo(Math.cos(ang) * r * (1 + 0.3 * e), Math.sin(ang) * r * (1 + 0.3 * e));
    }
    ctx.stroke();
  }

  // Schwanz
  const wag = Math.sin(t * 6) * r * 0.12;
  ctx.fillStyle = `hsla(45, 75%, 50%, ${a})`;
  ctx.beginPath();
  ctx.moveTo(-r * 0.85, 0);
  ctx.lineTo(-r * 1.35, -r * 0.35 + wag);
  ctx.lineTo(-r * 1.35, r * 0.35 + wag);
  ctx.closePath(); ctx.fill();

  // Körper: normal oval, aufgeblasen rund
  const ry = r * (0.75 + 0.25 * Math.min(e, 1));
  ctx.fillStyle = `hsla(50, 85%, 60%, ${a})`;
  ctx.beginPath(); ctx.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2); ctx.fill();
  // heller Bauch
  ctx.fillStyle = `hsla(52, 70%, 85%, ${0.85 * a})`;
  ctx.beginPath(); ctx.ellipse(0, ry * 0.4, r * 0.75, ry * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  // Flecken
  ctx.fillStyle = `hsla(30, 50%, 35%, ${0.75 * a})`;
  for (const [sx, sy] of PUFF_SPOTS) {
    ctx.beginPath(); ctx.arc(sx * r, sy * ry, r * 0.09, 0, Math.PI * 2); ctx.fill();
  }
  // Seitenflosse, flattert
  const flap = Math.sin(t * 10) * 0.4;
  ctx.fillStyle = `hsla(45, 75%, 50%, ${0.9 * a})`;
  ctx.beginPath(); ctx.ellipse(r * 0.05, ry * 0.15, r * 0.22, r * 0.1, flap, 0, Math.PI * 2); ctx.fill();
  // Auge (aufgeblasen etwas größer = erschrocken)
  const eyeR = r * (0.16 + 0.04 * Math.min(e, 1));
  ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
  ctx.beginPath(); ctx.arc(r * 0.5, -ry * 0.25, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(10, 20, 30, ${a})`;
  ctx.beginPath(); ctx.arc(r * 0.55, -ry * 0.25, eyeR * 0.55, 0, Math.PI * 2); ctx.fill();
  // Mund ("o")
  ctx.strokeStyle = `hsla(20, 50%, 30%, ${a})`;
  ctx.lineWidth = Math.max(1, base * 0.06);
  ctx.beginPath(); ctx.arc(r * 0.95, ry * 0.1, r * 0.07, 0, Math.PI * 2); ctx.stroke();

  ctx.restore();
}

// ---------------- Theme: Frieren ----------------
let frost = [];
function buildFrost() {
  frost = [];
  const reach = 0.24 * M;
  const edgeDist = (x, y) => Math.min(x, W - x, y, H - y);
  function grow(x, y, ang, len, depth) {
    const steps = 6, seg = len / steps;
    let cx = x, cy = y;
    for (let s = 0; s < steps && frost.length < 2500; s++) {
      ang += rnd(-0.25, 0.25);
      const nx = cx + Math.cos(ang) * seg, ny = cy + Math.sin(ang) * seg;
      frost.push({ x1: cx, y1: cy, x2: nx, y2: ny, d: edgeDist(nx, ny) / reach, w: Math.max(0.6, 1.6 - depth * 0.5) });
      if (depth < 3 && Math.random() < 0.4) {
        grow(nx, ny, ang + (Math.random() < 0.5 ? -1 : 1) * rnd(0.6, 1.1), len * 0.5, depth + 1);
      }
      cx = nx; cy = ny;
    }
  }
  for (let i = 0; i < 44; i++) {
    const e = i % 4, p = Math.random();
    let x, y, ang;
    if (e === 0) { x = p * W; y = 0; ang = Math.PI / 2; }
    else if (e === 1) { x = W; y = p * H; ang = Math.PI; }
    else if (e === 2) { x = p * W; y = H; ang = -Math.PI / 2; }
    else { x = 0; y = p * H; ang = 0; }
    grow(x, y, ang + rnd(-0.6, 0.6), rnd(0.1, 0.2) * M, 0);
  }
}
function drawFreeze(a, f) {
  if (f <= 0.001) return;
  ctx.globalCompositeOperation = 'source-over';
  const w = f * 0.2 * M;
  const col = (o) => `rgba(215, 238, 255, ${o})`;
  const edges = [
    [0, 0, 0, w, 0, 0, W, w], [0, H, 0, H - w, 0, H - w, W, w],
    [0, 0, w, 0, 0, 0, w, H], [W, 0, W - w, 0, W - w, 0, w, H]
  ];
  for (const [x1, y1, x2, y2, rx, ry, rw, rh] of edges) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0, col(0.55 * a * f));
    g.addColorStop(1, col(0));
    ctx.fillStyle = g;
    ctx.fillRect(rx, ry, rw, rh);
  }
  ctx.strokeStyle = `rgba(240, 250, 255, ${0.75 * a})`;
  ctx.lineCap = 'round';
  for (const s of frost) {
    if (s.d > f) continue;
    ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
}

// ---------------- Theme: Kirschblüten ----------------
const petals = Array.from({ length: 24 }, () => newPetal(true));
function newPetal(anywhere) {
  return {
    x: Math.random(), y: anywhere ? Math.random() : rnd(-0.15, -0.03),
    size: rnd(5, 10), rot: rnd(0, Math.PI * 2), vr: rnd(-1.5, 1.5),
    vy: rnd(0.04, 0.09), sway: rnd(0.01, 0.03), phase: rnd(0, 10), light: rnd(82, 92)
  };
}
function drawCherry(a, t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  for (const [cx, cy] of [[0, 0], [W, 0]]) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, M * 0.6);
    g.addColorStop(0, `rgba(255, 180, 210, ${0.14 * a})`);
    g.addColorStop(1, 'rgba(255, 180, 210, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < petals.length; i++) {
    const p = petals[i];
    p.y += p.vy * dt;
    p.x += Math.sin(t * 1.2 + p.phase) * p.sway * dt;
    p.rot += p.vr * dt;
    if (p.y > 1.05) petals[i] = newPetal(false);
    ctx.save();
    ctx.translate(p.x * W, p.y * H);
    ctx.rotate(p.rot);
    ctx.scale(1, 0.55 + 0.35 * Math.sin(t * 2 + p.phase));
    ctx.fillStyle = `hsla(340, 85%, ${p.light}%, ${0.85 * a})`;
    ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(335, 70%, 70%, ${0.5 * a})`;
    ctx.beginPath(); ctx.ellipse(-p.size * 0.3, 0, p.size * 0.35, p.size * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---------------- Schaden: kurzer roter Rahmen ----------------
let lastHits = null;
let hitAt = -Infinity;
function checkHits(s, now) {
  if (!s || typeof s.hits !== 'number') return;
  if (lastHits !== null && s.hits > lastHits) hitAt = now;
  lastHits = s.hits; // sinkt der Zähler (Mod neu gestartet), einfach übernehmen
}
function drawHit(now) {
  const p = (now - hitAt) / HIT_MS;
  if (p < 0 || p > 1) return;
  const f = (p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85) * HIT_ALPHA;
  ctx.globalCompositeOperation = 'source-over';
  const glow = 24;
  const edges = [
    [0, 0, 0, glow, 0, 0, W, glow], [0, H, 0, H - glow, 0, H - glow, W, glow],
    [0, 0, glow, 0, 0, 0, glow, H], [W, 0, W - glow, 0, W - glow, 0, glow, H]
  ];
  for (const [x1, y1, x2, y2, rx, ry, rw, rh] of edges) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0, `rgba(255, 0, 0, ${0.5 * f})`);
    g.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, ry, rw, rh);
  }
  ctx.strokeStyle = `rgba(255, 30, 30, ${f})`;
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}

// ---------------- Hauptschleife ----------------
function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight;
  D = Math.max(W, H); M = Math.min(W, H);
  buildFrost();
}
resize();
addEventListener('resize', resize);

const start = performance.now();
let last = start;
function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  const s = (testTheme || demo) ? testState(now - start) : state;

  const targetFreeze = s ? Math.max(0, Math.min(1, s.freeze || 0)) : 0;
  freezeLevel += (targetFreeze - freezeLevel) * Math.min(1, dt * 4);

  const active = pickTheme(s, now);
  for (const k in alpha) {
    const target = k === active ? 1 : 0;
    const step = dt / FADE_S;
    alpha[k] = target > alpha[k] ? Math.min(1, alpha[k] + step) : Math.max(0, alpha[k] - step);
  }
  if (active === 'portal') alpha.portal = 1; // Portal blendet über PORTAL_RAMP_MS selbst ein

  checkHits(s, now);

  ctx.clearRect(0, 0, W, H);
  if (alpha.cherry > 0)     drawCherry(alpha.cherry * STRENGTH, t, dt);
  if (alpha.underwater > 0) drawUnderwater(alpha.underwater * STRENGTH, t, dt);
  if (alpha.freeze > 0)     drawFreeze(alpha.freeze * STRENGTH, freezeLevel);
  if (alpha.portal > 0)     drawPortal(alpha.portal * STRENGTH, t, dt, now);
  drawHit(now); // Schaden immer obendrauf, unabhängig vom Theme

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
