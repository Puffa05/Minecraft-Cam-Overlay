<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===================== Einstellungen =====================
const STATE_URL = 'http://127.0.0.1:7475/state'; // Zustands-Server im Mod
const POLL_MS   = 100;   // wie oft der Zustand abgefragt wird
const FADE_S    = 1.5;   // Dauer der Überblendung in Sekunden
const STRENGTH  = 1.0;   // Gesamtstärke aller Themes (0 bis 1)
const PORTAL_RAMP_MS = 4000; // Portal schwillt so lange an (wie im Spiel: 4 s)
const PORTAL_FALL_MS = 1000; // und klingt so schnell wieder ab (wie im Spiel: 1 s)
const PORTAL_MAX = 1.0;      // 1.0 = so stark wie im Spiel; kleiner = Cam bleibt besser sichtbar
// Original-Texturen kommen aus deinem laufenden Minecraft (auch aus deinem Ressourcenpaket).
// Laeuft Minecraft nicht (z. B. im ?demo), werden selbst gezeichnete Pixel-Ersatzgrafiken benutzt.
const TEXTURE_URL = STATE_URL.replace(/\/state$/, '/texture/');
const HIT_MS    = 450;   // Dauer des roten Aufleuchtens bei Schaden
const HIT_ALPHA = 0.7;   // Stärke des roten Rahmens
// Wie lange ein Zustand stabil sein muss, bevor er zählt (gegen Flackern)
const DEBOUNCE_MS = { inPortal: 100, underwater: 250, cherry: 1000 };
// Testen ohne Minecraft (an die Datei-URL anhängen):
//   ?demo   ?theme=portal   ?theme=underwater   ?theme=freeze   ?theme=cherry
//   Im Demo-Modus gibt es alle 2 Sekunden einen Test-Treffer.
// =========================================================

const params = new URLSearchParams(location.search);
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0, D = 0, M = 0;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------------- Zustand vom Mod ----------------
let state = null;
let inFlight = false;

async function poll() {
  if (inFlight) return;
  inFlight = true;
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 500);
    const res = await fetch(STATE_URL, { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(to);
    state = await res.json();
  } catch (e) {
    state = null; // Minecraft/Mod läuft nicht -> alles ausblenden
  } finally {
    inFlight = false;
  }
}

// Testmodus
const testTheme = params.get('theme');
const demo = params.has('demo');
function testState(ms) {
  const s = { inWorld: true, inPortal: false, underwater: false, inLava: false,
              freeze: 0, biome: 'minecraft:plains', hits: demo ? Math.floor(ms / 2000) : 0 };
  let theme = testTheme, phase = 0;
  if (demo) {
    const list = ['portal', 'underwater', 'freeze', 'cherry', 'none'];
    theme = list[Math.floor(ms / 6000) % list.length];
    phase = (ms % 6000) / 6000;
  }
  if (theme === 'portal') s.inPortal = phase < 0.85 || !demo;
  if (theme === 'underwater') s.underwater = true;
  if (theme === 'freeze') s.freeze = demo ? Math.min(phase * 1.6, 1) : 1;
  if (theme === 'cherry') s.biome = 'minecraft:cherry_grove';
  return s;
}

if (!testTheme && !demo) { poll(); setInterval(poll, POLL_MS); }

// ---------------- Entprellen ----------------
const stable = {}, pending = {};
function debounce(key, value, now) {
  const delay = DEBOUNCE_MS[key] ?? 0;
  if (!(key in stable)) { stable[key] = value; return value; }
  if (value === stable[key]) { delete pending[key]; return value; }
  if (!pending[key] || pending[key].v !== value) pending[key] = { v: value, t: now };
  if (now - pending[key].t >= delay) { stable[key] = value; delete pending[key]; }
  return stable[key];
}

// ---------------- Theme-Auswahl nach Priorität ----------------
// Neue Themes hier einhängen, z. B. ganz oben:  if (s.inLava) return 'lava';
let freezeLevel = 0;
function pickTheme(s, now) {
  const portal = debounce('inPortal', !!(s && s.inPortal), now);
  const uw = debounce('underwater', !!(s && s.underwater), now);
  const cherry = debounce('cherry', !!(s && s.biome === 'minecraft:cherry_grove'), now);


  if (portal) return 'portal';              // 1. Portal
  if (freezeLevel > 0.03) return 'freeze';  // 2. Frieren
  if (uw) return 'underwater';              // 3. Unterwasser
  if (cherry) return 'cherry';              // 4. Kirschblüten
  return 'none';
}

const alpha = { portal: 0, underwater: 0, freeze: 0, cherry: 0 };

// ---------------- Texturen aus Minecraft ----------------
// Werden vom Mod unter /texture/<name>.png geliefert. Bis dahin (oder ohne Mod) gelten die Ersatzgrafiken.
const tex = {};
function pixelCanvas(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'));
  return cv;
}
function loadTexture(name, fallback, onReady) {
  tex[name] = fallback();
  if (onReady) onReady(tex[name]);
  if (testTheme || demo) return;          // Testmodus: nur Ersatzgrafiken
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { tex[name] = img; if (onReady) onReady(img); };
  img.onerror = () => setTimeout(() => { img.src = TEXTURE_URL + name + '.png?' + Date.now(); }, 10000); // spaeter nochmal
  img.src = TEXTURE_URL + name + '.png';
}
// Kleiner Zufallsgenerator, damit die Ersatzgrafiken immer gleich aussehen
function seeded(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------- Theme: Portal (wie in Minecraft) ----------------
// Minecraft legt die animierte Portal-Textur ueber das ganze Bild. Die Staerke steigt im Portal
// in 4 s auf 100 % und faellt draussen in 1 s auf 0; die Deckkraft folgt x^4 * 0.8 + 0.2.
loadTexture('nether_portal', () => pixelCanvas(16, 512, g => {   // Ersatz: 32 Bilder lila Wirbel
  const r = seeded(7);
  const pal = ['#2c0a5a', '#4d0f8f', '#6a1fbf', '#8a2be2', '#a64dff', '#c27bff'];
  for (let f = 0; f < 32; f++) for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const v = Math.sin((x + f * 0.5) * 0.7) + Math.sin((y - f * 0.5) * 0.6 + x * 0.3) + r() * 1.2;
    g.fillStyle = pal[Math.max(0, Math.min(pal.length - 1, Math.floor((v + 2) / 4.2 * pal.length)))];
    g.globalAlpha = 0.75;
    g.fillRect(x, f * 16 + y, 1, 1);
  }
}));
let portalIntensity = 0; // entspricht nauseaIntensity im Spiel
function updatePortal(active, dt) {
  portalIntensity += active ? dt * 1000 / PORTAL_RAMP_MS : -dt * 1000 / PORTAL_FALL_MS;
  portalIntensity = Math.max(0, Math.min(1, portalIntensity));
}
function drawPortal(a, t) {
  if (portalIntensity <= 0) return;
  let x = portalIntensity;
  if (x < 1) { x *= x; x *= x; x = x * 0.8 + 0.2; }   // gleiche Kurve wie im Spiel
  const img = tex.nether_portal;
  const frames = Math.max(1, Math.floor(img.height / img.width));
  const frame = Math.floor(t * 20) % frames;          // 1 Bild pro Tick (20 pro Sekunde)
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;                   // grobe Pixel wie im Spiel
  ctx.globalAlpha = x * PORTAL_MAX * STRENGTH;
  ctx.drawImage(img, 0, frame * img.width, img.width, img.width, 0, 0, W, H); // ueber die ganze Cam gestreckt
  ctx.globalAlpha = 1;
}

// ---------------- Theme: Unterwasser (Minecraft-Stil) ----------------
// Wasserfarbe, animierte Wasser-Textur, das Unterwasser-Muster aus dem Spiel, Blasen-Partikel
// und Fische als Original-Item-Sprites. Alles in groben Pixeln, Fische nur oben/unten am Rand.
const WATER_COLOR = [63, 118, 228];     // Standard-Wasserfarbe in Minecraft (#3F76E4)
let waterTinted = null;                 // Wasser-Textur, blau eingefaerbt (die Original-Textur ist grau)
loadTexture('water_still', () => pixelCanvas(16, 512, g => {
  const r = seeded(11);
  for (let f = 0; f < 32; f++) for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const v = 150 + 40 * Math.sin((x + y * 0.5 + f) * 0.5) + r() * 40;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(x, f * 16 + y, 1, 1);
  }
}), img => {
  waterTinted = pixelCanvas(img.width, img.height, g => {
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = `rgb(${WATER_COLOR.join(',')})`;
    g.fillRect(0, 0, img.width, img.height);
    g.globalCompositeOperation = 'destination-in';   // Transparenz der Textur behalten
    g.drawImage(img, 0, 0);
  });
});
loadTexture('underwater', () => pixelCanvas(16, 16, g => {
  const r = seeded(13);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    g.fillStyle = `rgba(${30 + r() * 30},${85 + r() * 25},255,0.55)`;
    g.fillRect(x, y, 1, 1);
  }
}));
loadTexture('bubble', () => pixelCanvas(8, 8, g => {
  g.fillStyle = '#39b4ff';
  for (const [x, y] of [[2,0],[3,0],[4,0],[5,0],[1,1],[6,1],[0,2],[7,2],[0,3],[7,3],[0,4],[7,4],[0,5],[7,5],[1,6],[6,6],[2,7],[3,7],[4,7],[5,7]]) g.fillRect(x, y, 1, 1);
  g.fillStyle = '#ffffff'; g.fillRect(4, 2, 2, 1); g.fillRect(5, 3, 1, 1);
}));
// Ersatz-Fische (selbst gezeichnet, gleiche Ausrichtung wie die Minecraft-Items: Kopf unten links)
function fallbackFish(body, belly, fin) {
  return () => pixelCanvas(16, 16, g => {
    for (let i = 0; i < 9; i++) {           // schraeger Koerper
      g.fillStyle = body; g.fillRect(3 + i, 11 - i, 3, 3);
      g.fillStyle = belly; g.fillRect(3 + i, 13 - i, 2, 1);
    }
    g.fillStyle = fin; g.fillRect(12, 1, 3, 2); g.fillRect(13, 3, 2, 2); g.fillRect(11, 0, 2, 1);
    g.fillStyle = '#111'; g.fillRect(3, 12, 1, 1);
  });
}
loadTexture('cod', fallbackFish('#b89462', '#e2cfa8', '#8a6a42'));
loadTexture('salmon', fallbackFish('#a83a32', '#6d8a6a', '#5a2420'));
loadTexture('tropical_fish', fallbackFish('#f07020', '#ffffff', '#c04010'));
loadTexture('pufferfish', () => pixelCanvas(16, 16, g => {
  g.fillStyle = '#e8b52c'; g.fillRect(3, 3, 10, 10);
  g.fillStyle = '#f6e3b0'; g.fillRect(4, 8, 8, 5);
  g.fillStyle = '#9a6a10'; for (const [x, y] of [[5,4],[9,5],[7,3],[11,7]]) g.fillRect(x, y, 1, 1);
  g.fillStyle = '#fff'; g.fillRect(4, 5, 2, 2); g.fillRect(10, 5, 2, 2);
  g.fillStyle = '#111'; g.fillRect(5, 6, 1, 1); g.fillRect(10, 6, 1, 1);
  g.fillStyle = '#6aaee0'; g.fillRect(1, 7, 2, 3); g.fillRect(13, 7, 2, 3);
}));

// Pixelgroesse: so gross, dass ein 16er-Sprite etwa ein Zehntel der Cam-Hoehe hat
const px = () => Math.max(2, Math.round(M * 0.1 / 16));
const snap = (v) => Math.round(v / px()) * px();     // Positionen auf das Pixelraster legen

const bubbles = Array.from({ length: 22 }, () => newBubble(true));
function newBubble(anywhere) {
  const left = Math.random() < 0.5; // nur an den Raendern, nicht uebers Gesicht
  return {
    x: left ? rnd(0.02, 0.18) : rnd(0.82, 0.98),
    y: anywhere ? Math.random() : rnd(1.02, 1.2),
    size: Math.random() < 0.3 ? 2 : 1, vy: rnd(0.08, 0.18), phase: rnd(0, 10)
  };
}
let waterScroll = 0;
function drawUnderwater(a, t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
  const P = px();

  // 1. Wasserfarbe, wie der Unterwasser-Nebel im Spiel
  ctx.fillStyle = `rgba(${WATER_COLOR.join(',')}, ${0.2 * a})`;
  ctx.fillRect(0, 0, W, H);

  // 2. Animierte Wasser-Textur, gross gekachelt und leicht treibend (1 Bild pro 2 Ticks wie im Spiel)
  if (waterTinted) {
    const tile = P * 16 * 3;
    const frames = Math.max(1, Math.floor(waterTinted.height / waterTinted.width));
    const frame = Math.floor(t * 10) % frames;
    waterScroll = (waterScroll + dt * P * 2) % tile;
    ctx.globalAlpha = 0.16 * a;
    for (let y = -tile; y < H + tile; y += tile) {
      for (let x = -tile; x < W + tile; x += tile) {
        ctx.drawImage(waterTinted, 0, frame * waterTinted.width, waterTinted.width, waterTinted.width,
          snap(x + waterScroll), snap(y + waterScroll * 0.4), tile, tile);
      }
    }
  }

  // 3. Unterwasser-Muster aus dem Spiel: 4 x 4 Kacheln, 10 % Deckkraft, langsam treibend
  const uw = tex.underwater;
  if (uw) {
    const tw = W / 4, th = H / 4;
    const ox = (t * 6) % tw, oy = (t * 2) % th;
    ctx.globalAlpha = 0.1 * a;
    for (let y = -1; y < 5; y++) for (let x = -1; x < 5; x++) {
      ctx.drawImage(uw, Math.floor(x * tw + ox), Math.floor(y * th + oy), Math.ceil(tw) + 1, Math.ceil(th) + 1);
    }
  }
  ctx.globalAlpha = 1;

  // 4. Dunkler Rand: wie die geringe Sichtweite unter Wasser
  const v = ctx.createRadialGradient(W / 2, H / 2, D * 0.25, W / 2, H / 2, D * 0.75);
  v.addColorStop(0, 'rgba(0, 25, 70, 0)');
  v.addColorStop(1, `rgba(0, 25, 70, ${0.55 * a})`);
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  // 5. Blasen (Original-Partikel), steigen am Rand auf
  const bub = tex.bubble;
  ctx.globalAlpha = 0.9 * a;
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    if (b.y < -0.05) bubbles[i] = newBubble(false);
    const s = bub.width * P * b.size * 0.75;
    const x = snap(b.x * W + Math.sin(t * 2 + b.phase) * P * 3);
    ctx.drawImage(bub, x, snap(b.y * H), s, s);
  }
  ctx.globalAlpha = 1;

  // 6. Fische und Kugelfisch (nach dem Rand, damit sie gut sichtbar bleiben)
  for (let i = 0; i < fishes.length; i++) {
    const f = fishes[i];
    f.x += f.dir * f.speed * dt;
    if (f.x < -0.15 || f.x > 1.15) fishes[i] = newFish(false);
    drawFish(fishes[i], a, t);
  }
  updatePuffer(dt);
  drawPuffer(a, t);
}

// ---------------- Fische (Minecraft-Item-Sprites) ----------------
const FISH_COUNT = 6;
const FISH_TYPES = ['cod', 'cod', 'salmon', 'salmon', 'tropical_fish', 'tropical_fish'];
const fishes = Array.from({ length: FISH_COUNT }, (_, i) => newFish(true, FISH_TYPES[i]));

// Fische schwimmen unten oder oben am Rand, nicht uebers Gesicht
function swimBand() { return Math.random() < 0.65 ? rnd(0.74, 0.9) : rnd(0.08, 0.2); }
function newFish(anywhere, type) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  return {
    dir, x: anywhere ? Math.random() : (dir > 0 ? -0.12 : 1.12), y: swimBand(),
    speed: rnd(0.03, 0.07), phase: rnd(0, 10), bob: rnd(0.004, 0.012),
    type: type || FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)]
  };
}
function drawFish(f, a, t) {
  const img = tex[f.type];
  const size = img.width * px();
  const x = snap(f.x * W), y = snap(f.y * H + Math.sin(t * 1.3 + f.phase) * f.bob * H);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  // Item-Sprites liegen schraeg (Kopf unten links): 45 Grad drehen, damit sie waagerecht schwimmen,
  // fuer die Richtung spiegeln, dazu leichtes Schwanzwedeln
  ctx.scale(-f.dir, 1);
  ctx.rotate(Math.PI / 4 + Math.sin(t * 8 + f.phase) * 0.06);
  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();
}

// ---------------- Kugelfisch ----------------
const PUFF_MIN_S = 6, PUFF_MAX_S = 14; // Abstand zwischen zwei Aufblas-Momenten
const PUFF_HOLD_S = 2.2;               // so lange bleibt er aufgeblasen
const puffer = { x: 0.15, y: 0.82, dir: 1, speed: 0.025, inflate: 0, mode: 'idle', modeT: 0, nextPuff: rnd(3, 6) };
// leichtes Ueberschwingen beim Aufblasen ("Plopp")
const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

function updatePuffer(dt) {
  const p = puffer;
  p.modeT += dt;
  if (p.mode === 'idle') {
    p.nextPuff -= dt;
    if (p.nextPuff <= 0) { p.mode = 'puff'; p.modeT = 0; }
  } else if (p.mode === 'puff') {
    p.inflate = easeOutBack(Math.min(1, p.modeT / 0.3));
    if (p.modeT > 0.3 + PUFF_HOLD_S) { p.mode = 'deflate'; p.modeT = 0; }
  } else if (p.mode === 'deflate') {
    p.inflate = Math.max(0, 1 - p.modeT / 0.8);
    if (p.inflate <= 0) { p.mode = 'idle'; p.nextPuff = rnd(PUFF_MIN_S, PUFF_MAX_S); }
  }
  // Aufgeblasen kommt er kaum voran. Am Rand dreht er um und bleibt so im Bild.
  p.x += p.dir * p.speed * (1 - 0.85 * Math.min(p.inflate, 1)) * dt;
  if (p.x > 0.9) p.dir = -1;
  if (p.x < 0.1) p.dir = 1;
}

function drawPuffer(a, t) {
  const p = puffer;
  const img = tex.pufferfish;
  const e = Math.max(0, p.inflate);
  // aufgeblasen gut 1,7-mal so gross, in ganzen Pixelstufen wie im Spiel
  const scale = px() * (1 + Math.round(0.75 * e * 4) / 4);
  const size = img.width * scale;
  const shake = e > 0.05 && p.mode === 'puff' && p.modeT < 0.5 ? Math.sin(t * 60) * scale * 0.5 : 0;
  const x = snap(p.x * W + shake), y = snap(p.y * H + Math.sin(t * 1.1) * 0.01 * H);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  ctx.scale(p.dir > 0 ? -1 : 1, 1);
  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();
}

// ---------------- Theme: Frieren (wie in Minecraft) ----------------
// Minecraft legt beim Frieren die Pulverschnee-Frosttextur ueber das ganze Bild, Deckkraft = freeze.
// Dazu fallen am Rand ein paar Schneeflocken (die Partikel, die Pulverschnee im Spiel erzeugt).
loadTexture('powder_snow_outline', () => pixelCanvas(256, 256, g => {   // Ersatz: Eiskristalle am Rand
  const r = seeded(17);
  const cols = ['#e8fbff', '#bff1ff', '#8fe3ff', '#ffffff'];
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const d = Math.min(x, 255 - x, y, 255 - y) / 256;
    const corner = Math.min(Math.hypot(x, y), Math.hypot(255 - x, y), Math.hypot(x, 255 - y), Math.hypot(255 - x, 255 - y)) / 256;
    if (r() < Math.pow(Math.max(0, 1 - d / 0.07), 1.5) + Math.pow(Math.max(0, 1 - corner / 0.35), 2) * 0.6) {
      g.fillStyle = cols[Math.floor(r() * cols.length)];
      g.fillRect(x, y, 1, 1);
    }
  }
}));
for (let i = 0; i < 8; i++) {
  loadTexture('generic_' + i, () => pixelCanvas(8, 8, g => {      // Ersatz: weisser Pixel-Punkt
    const n = Math.max(1, 4 - Math.floor(i / 2));
    g.fillStyle = '#fff';
    g.fillRect(4 - Math.ceil(n / 2), 4 - Math.ceil(n / 2), n, n);
  }));
}
const flakes = Array.from({ length: 26 }, () => newFlake(true));
function newFlake(anywhere) {
  const left = Math.random() < 0.5; // nur an den Raendern, nicht uebers Gesicht
  return {
    x: left ? rnd(0.0, 0.2) : rnd(0.8, 1.0), y: anywhere ? Math.random() : rnd(-0.15, -0.02),
    vy: rnd(0.05, 0.11), sway: rnd(0.005, 0.015), phase: rnd(0, 10), age: rnd(0, 8)
  };
}
function drawFreeze(a, f, t, dt) {
  if (f <= 0.001) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
  const outline = tex.powder_snow_outline;
  ctx.globalAlpha = a * f;                                   // wie im Spiel: Deckkraft = freeze
  ctx.drawImage(outline, 0, 0, W, H);                        // ueber die ganze Cam gestreckt
  // Schneeflocken: je staerker das Frieren, desto mehr
  const P = px();
  const visible = Math.round(flakes.length * f);
  for (let i = 0; i < flakes.length; i++) {
    const fl = flakes[i];
    fl.y += fl.vy * dt;
    fl.age += dt;
    if (fl.y > 1.05) flakes[i] = newFlake(false);
    if (i >= visible) continue;
    const sprite = tex['generic_' + (7 - Math.min(7, Math.floor(fl.age) % 8))]; // wird mit der Zeit kleiner
    const size = 8 * P * 0.75;
    ctx.globalAlpha = a * Math.min(1, f * 1.5) * 0.9;
    ctx.drawImage(sprite, snap(fl.x * W + Math.sin(t + fl.phase) * fl.sway * W), snap(fl.y * H), size, size);
  }
  ctx.globalAlpha = 1;
}

// ---------------- Theme: Kirschblueten (wie in Minecraft) ----------------
// Die Original-Kirschblaetter-Partikel (3 x 3 Pixel, 12 Varianten): trudeln langsam herab,
// drehen sich dabei (im Spiel +-30 Grad pro Sekunde, mit leichter Beschleunigung) und pendeln seitlich.
for (let i = 0; i < 12; i++) {
  loadTexture('cherry_' + i, () => pixelCanvas(3, 3, g => {       // Ersatz: rosa Pixel-Blatt
    const shades = ['#f7b9d6', '#ef9ac4', '#e77fb3'];
    g.fillStyle = shades[i % 3];
    for (const [x, y] of [[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2]]) g.fillRect(x, y, 1, 1);
  }));
}
const petals = Array.from({ length: 24 }, () => newPetal(true));
function newPetal(anywhere) {
  return {
    x: Math.random(), y: anywhere ? Math.random() : rnd(-0.15, -0.03),
    sprite: Math.floor(Math.random() * 12), scale: Math.random() < 0.5 ? 1 : 1.5,
    rot: rnd(0, Math.PI * 2), vr: (Math.random() < 0.5 ? -1 : 1) * Math.PI / 6, ar: rnd(-0.3, 0.3),
    vy: rnd(0.04, 0.08), sway: rnd(0.01, 0.03), phase: rnd(0, 10)
  };
}
function drawCherry(a, t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  for (const [cx, cy] of [[0, 0], [W, 0]]) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, M * 0.6);
    g.addColorStop(0, `rgba(255, 180, 210, ${0.14 * a})`);
    g.addColorStop(1, 'rgba(255, 180, 210, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.imageSmoothingEnabled = false;
  const P = px();
  for (let i = 0; i < petals.length; i++) {
    const p = petals[i];
    p.y += p.vy * dt;
    p.x += Math.sin(t * 1.2 + p.phase) * p.sway * dt;
    p.vr += p.ar * dt;                 // Drehung wird langsam schneller/langsamer
    p.rot += p.vr * dt;
    if (p.y > 1.05) petals[i] = newPetal(false);
    const img = tex['cherry_' + p.sprite];
    const size = img.width * P * 1.5 * p.scale;
    ctx.save();
    ctx.globalAlpha = 0.95 * a;
    ctx.translate(snap(p.x * W), snap(p.y * H));
    ctx.rotate(p.rot);
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
    ctx.restore();
  }
}

// ---------------- Schaden: kurzer roter Rahmen ----------------
let lastHits = null;
let hitAt = -Infinity;
function checkHits(s, now) {
  if (!s || typeof s.hits !== 'number') return;
  if (lastHits !== null && s.hits > lastHits) hitAt = now;
  lastHits = s.hits; // sinkt der Zähler (Mod neu gestartet), einfach übernehmen
}
function drawHit(now) {
  const p = (now - hitAt) / HIT_MS;
  if (p < 0 || p > 1) return;
  const f = (p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85) * HIT_ALPHA;
  ctx.globalCompositeOperation = 'source-over';
  const glow = 24;
  const edges = [
    [0, 0, 0, glow, 0, 0, W, glow], [0, H, 0, H - glow, 0, H - glow, W, glow],
    [0, 0, glow, 0, 0, 0, glow, H], [W, 0, W - glow, 0, W - glow, 0, glow, H]
  ];
  for (const [x1, y1, x2, y2, rx, ry, rw, rh] of edges) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0, `rgba(255, 0, 0, ${0.5 * f})`);
    g.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, ry, rw, rh);
  }
  ctx.strokeStyle = `rgba(255, 30, 30, ${f})`;
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}

// ---------------- Hauptschleife ----------------
function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight;
  D = Math.max(W, H); M = Math.min(W, H);
}
resize();
addEventListener('resize', resize);

const start = performance.now();
let last = start;
function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  const s = (testTheme || demo) ? testState(now - start) : state;

  const targetFreeze = s ? Math.max(0, Math.min(1, s.freeze || 0)) : 0;
  freezeLevel += (targetFreeze - freezeLevel) * Math.min(1, dt * 4);

  const active = pickTheme(s, now);
  for (const k in alpha) {
    const target = k === active ? 1 : 0;
    const step = dt / FADE_S;
    alpha[k] = target > alpha[k] ? Math.min(1, alpha[k] + step) : Math.max(0, alpha[k] - step);
  }
  if (active === 'portal') alpha.portal = 1; // Portal blendet wie im Spiel selbst ein (updatePortal)

  checkHits(s, now);
  updatePortal(active === 'portal', dt);

  ctx.clearRect(0, 0, W, H);
  if (alpha.cherry > 0)     drawCherry(alpha.cherry * STRENGTH, t, dt);
  if (alpha.underwater > 0) drawUnderwater(alpha.underwater * STRENGTH, t, dt);
  if (alpha.freeze > 0)     drawFreeze(alpha.freeze * STRENGTH, freezeLevel, t, dt);
  if (alpha.portal > 0)     drawPortal(alpha.portal * STRENGTH, t);
  drawHit(now); // Schaden immer obendrauf, unabhängig vom Theme

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
