plugins {
	// "remap"-Variante von Loom: noetig fuer verschleierte Minecraft-Versionen wie 1.21.11
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// Getrennte Sources: src/main (laeuft ueberall) und src/client (nur Client-Code)
	splitEnvironmentSourceSets()

	mods {
		"damagealert" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit-Tests ohne Minecraft (./gradlew test)
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events = ["passed", "failed"]
		exceptionFormat = "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Automatischer Ingame-Test (./gradlew runClientGameTest). Eigenes Source-Set "gametest",
// landet NICHT in der fertigen Mod-.jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "damagealert-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom {
	runs {
		clientGameTest {
			// Fabrics Test-Netzwerk-Synchronisierer verkraftet die langsamen Ticks im Software-Rendering nicht
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
		}
	}
}

// Fertige Mod und Overlays in den Ordner download/ legen (wird mit ins Repo committet,
// damit man sie direkt auf GitHub herunterladen kann). Laeuft automatisch nach "build".
def downloadSync = tasks.register("updateDownloads", Sync) {
	description = "Kopiert die fertige Mod-.jar und die Overlay-HTMLs nach download/"
	from(tasks.named("remapJar"))
	from("overlay") {
		include "*.html"
		into "overlay"
	}
	into layout.projectDirectory.dir("download")
	preserve {
		include "LIESMICH.md"
	}
}
tasks.named("build") {
	finalizedBy downloadSync
}
