<!doctype html>
<!--
  Beispiel-Overlay fuer OBS (Browserquelle, "Lokale Datei", 1920x1080).
  Fragt alle 200 ms http://127.0.0.1:7475/state beim Damage-Alert-Mod ab und zeigt:
  Unterwasser (blau), Lava (orange), Frieren (Frostrand), Gewitter (Blitz-Flackern), Biom-Name.
  Laeuft Minecraft nicht, bleibt das Overlay einfach unsichtbar.
  Farben und Texte unten frei anpassen.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Damage Alert Overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .layer { position: fixed; inset: 0; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #underwater { background: radial-gradient(ellipse at center, rgba(20,90,200,.15) 0%, rgba(10,40,120,.55) 100%); }
  #lava       { background: radial-gradient(ellipse at center, rgba(255,120,0,.10) 30%, rgba(200,40,0,.65) 100%); }
  #freeze     { box-shadow: inset 0 0 160px 60px rgba(200,235,255,.9); transition: opacity .2s linear; }
  #thunder    { background: rgba(255,255,255,.0); }
  #thunder.flash { animation: flash 6s infinite; }
  @keyframes flash { 0%, 92%, 100% { background: rgba(255,255,255,0); } 93% { background: rgba(255,255,255,.35); } 94% { background: rgba(255,255,255,0); } 95% { background: rgba(255,255,255,.25); } }
  #biome { position: fixed; left: 40px; bottom: 36px; padding: 10px 18px; border-radius: 10px;
           font: 600 30px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.45);
           opacity: 0; transition: opacity .6s ease; }
</style>
</head>
<body>
<div id="underwater" class="layer"></div>
<div id="lava" class="layer"></div>
<div id="freeze" class="layer"></div>
<div id="thunder" class="layer"></div>
<div id="biome"></div>
<script>
  const STATE_URL = "http://127.0.0.1:7475/state";
  const $ = id => document.getElementById(id);
  let lastBiome = null, biomeTimer = null;

  // "minecraft:cherry_grove" -> "Cherry Grove"
  const prettyBiome = id => id.replace(/^.*:/, "").split("_").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");

  function apply(s) {
    $("underwater").style.opacity = s.underwater ? 1 : 0;
    $("lava").style.opacity = s.inLava ? 1 : 0;
    $("freeze").style.opacity = s.freeze;              // 0..1
    $("thunder").style.opacity = s.thundering ? 1 : 0;
    $("thunder").classList.toggle("flash", s.thundering);

    // Biom-Name 5 Sekunden einblenden, wenn es sich aendert
    if (s.biome && s.biome !== lastBiome) {
      $("biome").textContent = prettyBiome(s.biome);
      $("biome").style.opacity = 1;
      clearTimeout(biomeTimer);
      biomeTimer = setTimeout(() => $("biome").style.opacity = 0, 5000);
    }
    lastBiome = s.biome;
  }

  async function poll() {
    try {
      const r = await fetch(STATE_URL, { cache: "no-store" });
      apply(await r.json());
    } catch (e) {
      apply({ underwater: false, inLava: false, freeze: 0, thundering: false, biome: null });
    }
    setTimeout(poll, 200);
  }
  poll();
</script>
</body>
</html>
