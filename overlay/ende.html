<!doctype html>
<!--
  STREAM-ENDE-SZENE: Nacht-Landschaft, Dankeschoen, Statistik der Tode, naechster Stream.
  OBS: Browserquelle -> "Lokale Datei" -> diese Datei, 1920 x 1080, als einzige Quelle der Szene.
  Die Todeszahlen kommen vom Mod; laeuft Minecraft nicht mehr, wird der letzte bekannte Stand gezeigt.

  Einstellungen: CONFIG unten aendern, oder als URL-Parameter:
    ?naechster=Freitag, 19 Uhr     Termin des naechsten Streams (leer = Zeile ausblenden)
    ?name=Puffa05
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Damage Alert – Stream-Ende</title>
<link rel="stylesheet" href="shared/minecraft.css">
<style>
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .center { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); text-align: center; display: grid; gap: 26px; justify-items: center; }
  .title { font-size: 120px; }
  .splash { position: absolute; right: -70px; top: 70px; font-size: 44px; }
  .stats { width: 900px; display: grid; gap: 18px; padding: 30px 44px; font-size: 36px; }
  .stats .row { display: flex; align-items: center; justify-content: space-between; }
  .stats .row span:first-child { display: flex; gap: 16px; align-items: center; }
  .stats .icon { width: 44px; height: 44px; }
  .stats b { font-size: 48px; color: var(--gold); }
  .next { font-size: 34px; color: #e8e8e8; }
  .bye { font-size: 40px; color: #fff; }
</style>
</head>
<body>
<canvas id="land"></canvas>
<div class="center">
  <div class="title mc-stone-title">Danke fürs Zuschauen!</div>
  <div class="splash mc-splash">GG!</div>
  <div class="stats mc-tooltip mc-text">
    <div class="row"><span><i data-icon="skull"></i>Tode in diesem Stream</span><b id="dSession">–</b></div>
    <div class="row"><span><i data-icon="heart"></i>Tode insgesamt</span><b id="dTotal">–</b></div>
    <div class="row" id="nextRow"><span><i data-icon="clock"></i>Nächster Stream</span><b id="next" style="font-size:36px;color:#fff"></b></div>
  </div>
  <div class="bye mc-text" id="bye"></div>
</div>

<script src="shared/textures.js"></script>
<script src="shared/damagealert.js"></script>
<script src="shared/landscape.js"></script>
<script>
  const CONFIG = {
    next: MC.param("naechster", ""),
    name: MC.param("name", "Puffa05"),
  };
  MC.landscape(document.getElementById("land"), { night: true, speed: 14, seed: 3 });
  MC.applyIcons();
  if (CONFIG.next) document.getElementById("next").textContent = CONFIG.next;
  else document.getElementById("nextRow").style.display = "none";
  document.getElementById("bye").textContent = CONFIG.name ? `Bis zum nächsten Mal – ${CONFIG.name}` : "Bis zum nächsten Mal!";
  MC.live.on("state", s => {
    if (!s.deaths) return;
    document.getElementById("dSession").textContent = s.deaths.session;
    document.getElementById("dTotal").textContent = s.deaths.total;
  });
</script>
</body>
</html>
