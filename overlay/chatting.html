<!doctype html>
<!--
  "JUST CHATTING"-SZENE: grosse Kamera, Platz fuer den Chat, Statistik.
  OBS: Browserquelle -> "Lokale Datei" -> diese Datei, 1920 x 1080, ganz oben.
  Darunter: Kamera genau in den grossen Rahmen (1216 x 684 bei x=64, y=196),
  Chat-Quelle (z. B. Twitch-Chat als Browserquelle) in den rechten Rahmen (480 x 540 bei x=1376, y=196).
  Beide Flaechen sind im Overlay durchsichtig, damit Kamera und Chat darunter zu sehen sind.

  Einstellungen: CONFIG unten aendern, oder als URL-Parameter:
    ?name=Puffa05     Name
    ?titel=...        Titel oben (Standard: Just Chatting)
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Damage Alert – Just Chatting</title>
<link rel="stylesheet" href="shared/minecraft.css">
<style>
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; filter: blur(3px) brightness(.75); }
  .top { position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 28px; }
  .title { font-size: 72px; }
  .who { font-size: 32px; display: flex; gap: 14px; align-items: center; }
  .who .icon { width: 38px; height: 34px; }
  #cam { left: 64px; top: 196px; width: 1216px; height: 684px; }
  #chat { left: 1376px; top: 196px; width: 480px; height: 540px; }
  .label { position: absolute; top: -66px; left: 0; font-size: 26px; display: flex; gap: 10px; align-items: center; }
  .label .icon { width: 30px; height: 30px; }
  .stats { position: absolute; left: 1376px; top: 786px; width: 480px; display: grid; gap: 10px; font-size: 28px; }
  .stats .row { display: flex; align-items: center; gap: 14px; }
  .stats b { font-size: 40px; }
  .stats .icon { width: 36px; height: 36px; }
  .bottom { position: absolute; left: 64px; width: 1216px; font-size: 30px; text-align: center; }
</style>
</head>
<body>
<canvas id="land"></canvas>
<div class="top">
  <div class="title mc-stone-title" id="title">Just Chatting</div>
  <div class="who mc-tooltip mc-text"><span data-icon="heart"></span><span id="name"></span></div>
</div>
<div class="mc-frame wood" id="cam"></div>
<div class="mc-frame" id="chat"><div class="label mc-text"><span data-icon="chat"></span>Chat</div></div>
<div class="stats mc-tooltip mc-text">
  <div class="row"><span data-icon="skull"></span><span>Tode im Stream: <b id="dSession">–</b></span></div>
  <div class="row" style="color:#c8c8c8"><span data-icon="heart"></span><span>Tode gesamt: <span id="dTotal">–</span></span></div>
</div>
<div class="bottom mc-splash" id="splash" style="transform:none;animation:none;bottom:60px"></div>

<script src="shared/textures.js"></script>
<script src="shared/damagealert.js"></script>
<script src="shared/landscape.js"></script>
<script>
  const CONFIG = {
    name: MC.param("name", "Puffa05"),
    title: MC.param("titel", "Just Chatting"),
    lines: ["Schreib was in den Chat!", "Kurze Pause vom Abbauen", "Fragen? Her damit!", "Gleich geht's weiter ins Spiel"],
  };
  MC.landscape(document.getElementById("land"), { speed: 18 });

  // Kamera- und Chat-Flaeche aus dem Hintergrund ausschneiden, damit die Quellen darunter sichtbar sind
  const holes = ["cam", "chat"].map(id => {
    const r = document.getElementById(id).getBoundingClientRect();
    return `linear-gradient(#000,#000) ${r.left}px ${r.top}px / ${r.width}px ${r.height}px no-repeat`;
  });
  const land = document.getElementById("land");
  const maskValue = [...holes, "linear-gradient(#000,#000)"].join(", ");
  land.style.webkitMask = maskValue;
  land.style.webkitMaskComposite = "xor";
  land.style.mask = maskValue;
  land.style.maskComposite = "exclude";
  MC.applyIcons();
  document.getElementById("name").textContent = CONFIG.name;
  document.getElementById("title").textContent = CONFIG.title;
  let li = 0;
  function line() { document.getElementById("splash").textContent = CONFIG.lines[li++ % CONFIG.lines.length]; }
  line(); setInterval(line, 10000);
  MC.live.on("state", s => {
    if (!s.deaths) return;
    document.getElementById("dSession").textContent = s.deaths.session;
    document.getElementById("dTotal").textContent = s.deaths.total;
  });
</script>
</body>
</html>
